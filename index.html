<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sharkbite · Ambientes</title>
<link rel="icon" type="image/png" href="img/logo/logo_shark.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#eaf0f6;--panel:#fff;--border:#e1e8f0;--text:#1f2d3d;--muted:#64788f;--heading:#0b2a4a;--primary:#0b2a4a;--primary-h:#123c66;--shadow:0 8px 30px rgba(11,42,74,.10)}
:root[data-theme=dark]{--bg:#0b1220;--panel:#16233a;--border:#25344f;--text:#dbe4f0;--muted:#8fa3bf;--heading:#e8f0fb;--primary:#16365c;--primary-h:#1f4a7c;--shadow:0 8px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Inter','Segoe UI',Tahoma,sans-serif}
.appbar{display:flex;align-items:center;gap:12px;padding:12px clamp(12px,3vw,32px);background:var(--primary);color:#fff}
.appbar img{width:36px;height:36px}
.appbar b{margin-right:auto;font-size:22px;font-weight:800}
main{max-width:1100px;margin:0 auto;padding:28px clamp(12px,3vw,32px)}
.head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px}
h1{margin:0;font-size:clamp(22px,3vw,30px);font-weight:800;color:var(--heading)}
.head-acts{display:flex;gap:8px}
.btn{border:0;border-radius:8px;padding:9px 14px;background:var(--primary);color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--primary-h)}
.btn.ghost{background:rgba(255,255,255,.16)}
.btn.ghost:hover{background:rgba(255,255,255,.26)}
.btn.sec{background:var(--panel);color:var(--heading);border:1px solid var(--border)}
.btn:focus-visible,.card:focus-visible,.acts button:focus-visible{outline:2px solid #0f9fb0;outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{position:relative;padding:20px 18px 18px;background:var(--panel);border:1px solid var(--border);border-top:5px solid var(--c);border-radius:14px;box-shadow:var(--shadow);cursor:pointer}
.card:hover{border-color:var(--c)}
.ico{display:flex;align-items:center;justify-content:center;width:46px;height:46px;margin-bottom:14px;border-radius:12px;background:color-mix(in srgb,var(--c) 18%,transparent);font-size:23px}
.card h2{margin:0 0 4px;font-size:18px;font-weight:700;color:var(--heading);overflow-wrap:anywhere}
.card p{margin:0;font-size:13px;color:var(--muted)}
.acts{position:absolute;top:10px;right:10px;display:flex;gap:2px}
.acts button{width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:15px;cursor:pointer}
.acts button:hover{background:var(--bg);color:var(--heading)}
.vazio{grid-column:1/-1;padding:44px 20px;text-align:center;color:var(--muted);border:2px dashed var(--border);border-radius:14px}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(11,42,74,.55);z-index:10}
.overlay.on{display:flex}
.modal{width:min(420px,100%);padding:22px;background:var(--panel);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal h2{margin:0 0 16px;font-size:20px;color:var(--heading)}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:4px;font-size:13px;font-weight:600;color:var(--heading)}
.field input[type=text]{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-family:inherit;font-size:15px}
.field input[type=color]{width:56px;height:36px;padding:2px;border:1px solid var(--border);border-radius:8px;background:var(--bg);cursor:pointer}
.row{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:end}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
</style>
</head>
<body>
<header class="appbar">
    <img src="img/logo/logo_shark.png" alt="">
    <b>Sharkbite</b>
    <button class="btn ghost" onclick="alternarTema()">Tema</button>
</header>
<main>
    <div class="head">
        <h1>Ambientes</h1>
        <div class="head-acts">
            <button class="btn sec" id="btnArq" onclick="alternarArquivados()">Ver arquivados</button>
            <button class="btn" onclick="abrirModal()">Novo ambiente</button>
        </div>
    </div>
    <div class="grid" id="lista"><div class="vazio">Carregando ambientes…</div></div>
</main>

<div class="overlay" id="modal" onclick="if(event.target===this) fecharModal()">
    <div class="modal">
        <h2>Novo ambiente</h2>
        <div class="field"><label for="nomeAmb">Nome</label><input type="text" id="nomeAmb" maxlength="60" placeholder="Ex.: Equipe de BI" onkeydown="if(event.key==='Enter') criar()"></div>
        <div class="row">
            <div class="field"><label for="corAmb">Cor</label><input type="color" id="corAmb" value="#0f9fb0"></div>
            <div class="field"><label for="icoAmb">Ícone (emoji)</label><input type="text" id="icoAmb" maxlength="4" value="📋"></div>
        </div>
        <div class="actions">
            <button class="btn sec" onclick="fecharModal()">Cancelar</button>
            <button class="btn" onclick="criar()">Criar ambiente</button>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL  = 'https://vaipqzmdsdanypuprxrk.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZhaXBxem1kc2RhbnlwdXByeHJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NDA0MTAsImV4cCI6MjEwNjExNjQxMH0.r5PBsVKPDDROHaBWbLpsnaezMmsdxc97pkm5205ji-c';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let ambientes = [], verArquivados = false;
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const fmtData = s => s ? new Date(s).toLocaleDateString('pt-BR') : '';

/* Tema: mesma preferência usada dentro dos ambientes */
function aplicarTema(){
    const p = localStorage.getItem('sharkbite_tema');
    const escuro = p ? p === 'escuro' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = escuro ? 'dark' : 'light';
}
function alternarTema(){
    const escuro = document.documentElement.dataset.theme === 'dark';
    localStorage.setItem('sharkbite_tema', escuro ? 'claro' : 'escuro');
    aplicarTema();
}

/* Login provisório (igual ao do Admin) até existir a página de login */
async function garantirLogin(){
    const { data: { session } } = await sb.auth.getSession();
    if(session) return true;
    const email = prompt('E-mail (admin):'); if(!email) return false;
    const senha = prompt('Senha:'); if(!senha) return false;
    const { error } = await sb.auth.signInWithPassword({ email, password: senha });
    if(error){ alert('Login falhou: ' + error.message); return false; }
    return true;
}

async function carregar(){
    const { data, error } = await sb.from('ambientes').select('*').order('id');
    if(error){ $('lista').innerHTML = `<div class="vazio">Não foi possível carregar os ambientes: ${esc(error.message)}</div>`; return; }
    ambientes = data || [];
    render();
}

function render(){
    const lista = ambientes.filter(a => (a.ativo !== false) !== verArquivados);
    $('btnArq').textContent = verArquivados ? 'Ver ativos' : 'Ver arquivados';
    if(!lista.length){
        $('lista').innerHTML = `<div class="vazio">${verArquivados ? 'Nenhum ambiente arquivado.' : 'Nenhum ambiente ainda. Crie o primeiro em “Novo ambiente”.'}</div>`;
        return;
    }
    $('lista').innerHTML = lista.map(a => {
        const arq = a.ativo === false;
        return `<article class="card" tabindex="0" style="--c:${esc(a.cor || '#0f9fb0')}" onclick="abrir(${a.id})" onkeydown="if(event.key==='Enter') abrir(${a.id})">
            <div class="acts">
                <button title="Renomear" onclick="event.stopPropagation(); renomear(${a.id})">✎</button>
                <button title="${arq ? 'Restaurar' : 'Arquivar'}" onclick="event.stopPropagation(); alternarAtivo(${a.id})">${arq ? '↺' : '🗃'}</button>
            </div>
            <div class="ico">${esc(a.icone || '📋')}</div>
            <h2>${esc(a.nome)}</h2>
            <p>Criado em ${fmtData(a.criado_em)}</p>
        </article>`;
    }).join('');
}

function abrir(id){ location.href = 'ambiente.html?id=' + id; }
function alternarArquivados(){ verArquivados = !verArquivados; render(); }

function abrirModal(){ $('nomeAmb').value = ''; $('modal').classList.add('on'); setTimeout(() => $('nomeAmb').focus(), 50); }
function fecharModal(){ $('modal').classList.remove('on'); }

async function criar(){
    const nome = $('nomeAmb').value.trim();
    if(!nome){ $('nomeAmb').focus(); return; }
    if(!await garantirLogin()) return;
    const { data, error } = await sb.from('ambientes')
        .insert({ nome, cor: $('corAmb').value, icone: $('icoAmb').value.trim() || '📋' })
        .select().single();
    if(error){ alert('Não foi possível criar o ambiente: ' + error.message); return; }
    ambientes.push(data);
    verArquivados = false;
    fecharModal();
    render();
}

async function renomear(id){
    const a = ambientes.find(x => x.id === id); if(!a) return;
    const nome = prompt('Novo nome do ambiente:', a.nome);
    if(nome === null || !nome.trim() || nome.trim() === a.nome) return;
    if(!await garantirLogin()) return;
    const { error } = await sb.from('ambientes').update({ nome: nome.trim() }).eq('id', id);
    if(error){ alert('Não foi possível renomear: ' + error.message); return; }
    a.nome = nome.trim();
    render();
}

async function alternarAtivo(id){
    const a = ambientes.find(x => x.id === id); if(!a) return;
    const arquivar = a.ativo !== false;
    if(arquivar && !confirm(`Arquivar “${a.nome}”? Os dados continuam salvos e você pode restaurar depois.`)) return;
    if(!await garantirLogin()) return;
    const { error } = await sb.from('ambientes').update({ ativo: !arquivar }).eq('id', id);
    if(error){ alert('Não foi possível atualizar: ' + error.message); return; }
    a.ativo = !arquivar;
    render();
}

aplicarTema();
carregar();
</script>
</body>
</html>
