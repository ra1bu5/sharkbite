<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Sharkbite</title>
<link rel="icon" type="image/png" href="img/logo/logo_shark.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/01-base.css">
<link rel="stylesheet" href="css/02-layout.css">
<link rel="stylesheet" href="css/03-componentes.css">
<link rel="stylesheet" href="css/10-admin.css">
<style>
/* pequenos ajustes só pra essa página */
.admin-page{max-width:1100px;margin:0 auto;padding:24px clamp(12px,3vw,32px)}
.admin-page h1{margin:0 0 6px;font-size:26px;color:var(--text-heading)}
.admin-page .sub{color:var(--text-muted);margin-bottom:22px}
.pane-nav{display:flex;gap:6px;border-bottom:2px solid var(--border-color-strong);margin-bottom:18px;flex-wrap:wrap}
.pane-nav button{background:var(--bg-panel-dark);border:0;border-radius:8px 8px 0 0;padding:10px 16px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.pane-nav button.active{background:var(--primary);color:var(--text-on-primary)}
.pane{display:none}
.pane.active{display:block}
.user-row{display:grid;grid-template-columns:1fr 1fr 140px 100px;gap:12px;align-items:center;padding:10px 12px;background:var(--bg-panel);border:1px solid var(--border-color);border-radius:8px;margin-bottom:6px}
.user-row .nome{font-weight:700;color:var(--text-heading)}
.user-row .email{color:var(--text-muted);font-size:13px}
.user-row select{padding:5px 8px;border:1px solid var(--border-color-strong);border-radius:6px;background:var(--bg-panel-alt);color:var(--text);font-family:inherit;font-weight:600}
.user-row .criado{font-size:12px;color:var(--text-muted);text-align:right}
.badge-role{padding:3px 8px;border-radius:10px;font-size:11px;font-weight:700;text-transform:uppercase}
.badge-role.admin{background:#7a4b00;color:#fff}
.badge-role.basic{background:var(--bg-panel-dark);color:var(--text-muted)}
.tag-amb{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border-radius:8px;background:var(--bg-panel);border:1px solid var(--border-color);margin:4px 4px 0 0;font-size:14px}
.tag-amb .dot{width:9px;height:9px;border-radius:50%;background:var(--c,#0f9fb0)}
</style>
</head>
<body>

<div class="container">
  <header class="appbar">
    <div class="brand">
      <a href="index.html" style="display:flex">
        <img class="brand-logo" src="img/logo/logo_shark.png" alt="">
      </a>
      <div>
        <span class="brand-name">Sharkbite</span>
        <span class="brand-sub">Painel Admin</span>
      </div>
    </div>
    <div class="appbar-actions">
      <a class="btn btn-ghost btn-ic" href="index.html" style="text-decoration:none">‹ Ambientes</a>
      <span id="userTag" style="color:#fff;font-size:13px;opacity:.85"></span>
      <button class="btn btn-ghost" onclick="logout()">Sair</button>
    </div>
  </header>

  <div class="admin-page" id="adminWrap" style="display:none">
    <h1>Painel de Administrador</h1>
    <p class="sub">Gerencie usuários e a configuração global do Sharkbite.</p>

    <div class="pane-nav">
      <button class="active" data-pane="usuarios">Usuários</button>
      <button data-pane="tipos">Tipos</button>
      <button data-pane="status">Status</button>
      <button data-pane="responsaveis">Responsáveis</button>
      <button data-pane="areas">Áreas</button>
      <button data-pane="setores">Setores</button>
      <button data-pane="ambientes">Ambientes</button>
    </div>

    <div class="pane active" id="pane-usuarios">
      <div id="listaUsuarios"></div>
    </div>

    <div class="pane" id="pane-tipos">
      <ul class="admin-list" id="listaTipos"></ul>
      <div class="admin-add">
        <input type="color" id="novoTipoCor" value="#4caf50">
        <input type="text" id="novoTipoLabel" placeholder="Nome do tipo (ex.: Urgente)">
        <button class="btn btn-primary" onclick="addTipo()">Adicionar</button>
      </div>
    </div>

    <div class="pane" id="pane-status">
      <ul class="admin-list" id="listaStatus"></ul>
      <div class="admin-add">
        <input type="color" id="novoStatusCor" value="#9e9e9e">
        <input type="text" id="novoStatusLabel" placeholder="Nome do status (ex.: Pausado)">
        <button class="btn btn-primary" onclick="addStatus()">Adicionar</button>
      </div>
    </div>

    <div class="pane" id="pane-responsaveis">
      <ul class="admin-list" id="listaResponsaveis"></ul>
      <div class="admin-add">
        <input type="text" id="novoResponsavel" placeholder="Nome do responsável">
        <button class="btn btn-primary" onclick="addResponsavel()">Adicionar</button>
      </div>
    </div>

    <div class="pane" id="pane-areas">
      <ul class="admin-list" id="listaAreas"></ul>
      <div class="admin-add">
        <input type="text" id="novaArea" placeholder="Nome da área">
        <button class="btn btn-primary" onclick="addArea()">Adicionar</button>
      </div>
    </div>

    <div class="pane" id="pane-setores">
      <ul class="admin-list" id="listaSetores"></ul>
      <div class="admin-add">
        <input type="text" id="novoSetor" placeholder="Nome do setor">
        <button class="btn btn-primary" onclick="addSetor()">Adicionar</button>
      </div>
    </div>

    <div class="pane" id="pane-ambientes">
      <div id="listaAmbientes"></div>
    </div>
  </div>

  <div class="admin-page" id="loading" style="text-align:center;padding:60px">
    <p style="color:var(--text-muted)">Carregando…</p>
  </div>

  <div class="admin-page" id="negado" style="display:none;text-align:center;padding:60px">
    <h1>Acesso negado</h1>
    <p class="sub">Esta área é restrita a administradores.</p>
    <a class="btn btn-primary" href="index.html" style="text-decoration:none">Voltar</a>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/helpers.js"></script>
<script src="js/admin-page.js"></script>
</body>
</html>
